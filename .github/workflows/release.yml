name: Release desktop and web apps

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# A force-pushed release tag starts a new run. Keep only one run for the tag
# so two matrices never upload to the same draft release simultaneously.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-13
            args: --target x86_64-apple-darwin
          - platform: macos-14
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            # Avoid the WiX/MSI light.exe step; NSIS is the supported Windows
            # installer for this unsigned desktop release.
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      # v1 replaces matching assets on an existing draft release, allowing a
      # corrected release tag to be built again without asset-name conflicts.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 鲨鱼管家 ${{ github.ref_name }}
          releaseBody: 请查看本次版本说明与已知限制。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  web-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package web build
        run: tar -czf "shark-butler-web-${GITHUB_REF_NAME}.tar.gz" -C dist .
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: shark-butler-web-${{ github.ref_name }}
          path: shark-butler-web-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
