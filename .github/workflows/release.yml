name: Release desktop and web apps

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# A force-pushed release tag starts a new run. Keep only one run for the tag
# so two matrices never upload to the same draft release simultaneously.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Find or create draft release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const releaseName = `鲨鱼管家 ${tag}`;
            const releaseBody = '请查看本次版本说明与已知限制。';

            let release;
            try {
              release = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: releaseName,
                body: releaseBody,
                draft: true,
                prerelease: false
              });
            }

            if (!release.data.draft) {
              throw new Error(`Release ${tag} already exists and is not a draft.`);
            }

            core.setOutput('release_id', release.data.id);

  desktop-release:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-13
            args: --target x86_64-apple-darwin
          - platform: macos-14
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            # Avoid the WiX/MSI light.exe step; NSIS is the supported Windows
            # installer for this unsigned desktop release.
            args: --bundles nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      # Upload all matrix artifacts to the release created by prepare-release.
      # Supplying releaseId avoids concurrent tag lookups/creation by the matrix.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          args: ${{ matrix.args }}

  web-release:
    needs: prepare-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package web build
        run: tar -czf "shark-butler-web-${GITHUB_REF_NAME}.tar.gz" -C dist .
      - name: Upload web build to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${GITHUB_REF_NAME}" "shark-butler-web-${GITHUB_REF_NAME}.tar.gz" --repo "${GITHUB_REPOSITORY}" --clobber
